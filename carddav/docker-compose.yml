version: '3.8'
services:
  radicale:
    build: ./radicale
    ports:
      - "5232:5232"
    volumes:
      - carddav_data:/data
    restart: unless-stopped

  sync-service:
    build: ./sync-service
    ports:
      - "3001:3001"
    volumes:
      - carddav_data:/data
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - CARDDAV_DATA_PATH=/data
    depends_on:
      - radicale
    restart: unless-stopped

volumes:
  carddav_data:
